name: Daily Bot (paper)

# The Backtest Machine "daily loop": once per day, just after the 00:00 UTC daily close.
# Paper only - no exchange order is ever placed. State lives in data/daily_state.json, so a
# re-run on the same day is a no-op (never double-enters).
# GitHub only fires `schedule` triggers from the default branch.
on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trading-bot-data-writes
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run daily paper bot
        run: npm run daily
        env:
          MARKET_DATA_PROVIDER: ${{ vars.MARKET_DATA_PROVIDER }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          # All optional - defaults are BTC-USD, ema_cross 9/21, $100,000 paper capital.
          DAILY_SYMBOL: ${{ vars.DAILY_SYMBOL }}
          DAILY_STRATEGY: ${{ vars.DAILY_STRATEGY }}
          DAILY_PARAMS: ${{ vars.DAILY_PARAMS }}
          PAPER_CAPITAL: ${{ vars.PAPER_CAPITAL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit paper state
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "Daily bot: update paper state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "No state changes to commit."
          fi
