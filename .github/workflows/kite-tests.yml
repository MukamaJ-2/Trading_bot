name: Kite dashboard tests

on:
  push:
    paths: ["kite/**", ".github/workflows/kite-tests.yml"]
  pull_request:
    paths: ["kite/**", ".github/workflows/kite-tests.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kite/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app
      - name: Tests (mocked Kite state, no real orders)
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kite/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kite/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
