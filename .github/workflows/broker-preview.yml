name: Broker Preview

# Shows what the current signal/risk/memory decision would do against the real Alpaca
# paper account, WITHOUT submitting anything. Manual trigger only.
on:
  workflow_dispatch: {}

jobs:
  broker-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run broker:preview
        run: npm run broker:preview
        env:
          MARKET_DATA_PROVIDER: ${{ vars.MARKET_DATA_PROVIDER }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
