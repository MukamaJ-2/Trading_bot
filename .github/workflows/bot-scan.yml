name: Bot Scan

# Runs the live paper-trading scan on a schedule using real Coinbase Exchange market data.
# GitHub only fires `schedule` triggers from the default branch, so this starts
# running once this workflow file is merged into that branch.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trading-bot-data-writes
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run scan
        run: npm run scan
        env:
          # Optional - unset unless you've configured the repo for Alpaca instead of
          # the default Coinbase source. Missing vars/secrets just resolve to "".
          MARKET_DATA_PROVIDER: ${{ vars.MARKET_DATA_PROVIDER }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          # CAUTION: if the BROKER repo variable is set to "alpaca", this scheduled run
          # will actually submit real Alpaca PAPER orders every 15 minutes (never live -
          # src/brokerAlpaca.ts hardcodes the paper endpoint). Run `npm run broker:check`
          # and `npm run broker:preview` locally or via workflow_dispatch first.
          BROKER: ${{ vars.BROKER }}

      - name: Commit memory updates
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "Bot scan: update memory [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "No memory changes to commit."
          fi
